<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keyboard focus regression</title>
  <style>
    body { margin: 24px; background: #10191b; color: white; font: 20px sans-serif; }
    input, textarea { display: block; box-sizing: border-box; width: 100%; min-height: 64px; margin: 24px 0; font: inherit; }
  </style>
</head>
<body>
  <h1>Game text input</h1>
  <input aria-label="Game text input" placeholder="Tap here to type">
  <textarea aria-label="Game multiline input" placeholder="Tap here to type"></textarea>
</body>
</html>
