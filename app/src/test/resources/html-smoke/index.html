<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APK Forge HTML Smoke Test</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15161c; color: white; font: 20px sans-serif; }
    main { text-align: center; padding: 32px; }
    button { padding: 16px 24px; border: 0; border-radius: 12px; background: #8b5cf6; color: white; font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>HTML game is playable</h1>
    <p id="score">Score: 0</p>
    <button onclick="document.getElementById('score').textContent='Score: 1'">Play</button>
  </main>
</body>
</html>
